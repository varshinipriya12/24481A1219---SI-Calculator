<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Interest Calculator</title>
</head>

<body>

<center>

    <h1 style="color: green; font-family: Arial;">
        Simple Interest Calculator
    </h1>

    <form method="post">

        <input type="number" step="any" name="p"
               placeholder="Principal Amount" required>
        <br><br>

        <input type="number" step="any" name="t"
               placeholder="Time" required>
        <br><br>

        <input type="number" step="any" name="r"
               placeholder="Rate" required>
        <br><br>

        <button type="submit">Calculate Interest</button>

    </form>

</center>

{% if result %}

<hr>

<center>

    <h3>Result</h3>

    <p>Principal: {{ p }}</p>
    <p>Rate: {{ r }}</p>
    <p>Time: {{ t }}</p>

    <p>
        <b>Simple Interest: {{ result }}</b>
        <br><br>
        <b>Total Amount: {{ total }}</b>
    </p>

</center>

{% endif %}

</body>
</html>
